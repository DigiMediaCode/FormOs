# FormOS — Docker Compose for a self-managed VPS.
#
# The database stays on Supabase (external) and file uploads go to Google
# Drive/Dropbox, so this container is STATELESS — no volumes needed for data.
#
# Copy .env.example -> .env and fill it in before running:
#   docker compose up -d --build
#
# NEXT_PUBLIC_APP_URL is read from .env and passed as a BUILD ARG because
# NEXT_PUBLIC_* values are inlined into the client bundle at build time.

services:
  formos:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: formos:latest
    container_name: formos
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
    # ── Option A: publish a port and point your existing reverse proxy at it ──
    # (Nginx Proxy Manager / a host Nginx / Caddy → http://127.0.0.1:3001)
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

    # ── Option B: attach to a shared proxy network (Traefik) instead ──
    # Remove the `ports:` block above, then uncomment below and set your domain.
    # networks:
    #   - proxy
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.formos.rule=Host(`formos.com.au`)"
    #   - "traefik.http.routers.formos.entrypoints=websecure"
    #   - "traefik.http.routers.formos.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.formos.loadbalancer.server.port=3001"
    #   # FormOS server actions accept up to 15 MB (see next.config.ts):
    #   - "traefik.http.middlewares.formos-body.buffering.maxRequestBodyBytes=20971520"
    #   - "traefik.http.routers.formos.middlewares=formos-body"

